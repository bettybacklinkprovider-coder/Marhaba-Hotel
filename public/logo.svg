<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
  </defs>

  <!-- Background circle for contrast -->
  <circle cx="50" cy="50" r="48" fill="#0f172a" />

  <!-- Double Concentric Outer Circles -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#logoGold)" stroke-width="1.6" opacity="0.95" />
  <circle cx="49" cy="51" r="38" fill="none" stroke="url(#logoGold)" stroke-width="1.1" opacity="0.8" />

  <!-- Calligraphic Script 'M' -->
  <path d="M 22,62 C 18,52 24,38 33,40 C 39,41 38,55 42,66 C 45,51 52,38 60,37 C 68,36 67,52 70,68 C 72,55 77,44 82,46 C 85,47 82,53 79,53" fill="none" stroke="url(#logoGold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Swash entry loop for M -->
  <path d="M 28,66 C 21,70 16,63 22,55" fill="none" stroke="url(#logoGold)" stroke-width="2.8" stroke-linecap="round" />

  <!-- Botanical Leaf Branch on the right arc -->
  <g fill="url(#logoGold)">
    <!-- Stem curve -->
    <path d="M 78,55 Q 86,40 82,25" fill="none" stroke="url(#logoGold)" stroke-width="1.5" stroke-linecap="round" />
    <!-- Leaf 1 -->
    <path d="M 83,26 C 88,20 92,23 88,30 C 85,28 83,26 83,26 Z" />
    <!-- Leaf 2 -->
    <path d="M 81,34 C 88,31 90,36 84,40 C 82,37 81,34 81,34 Z" />
    <!-- Leaf 3 -->
    <path d="M 77,43 C 84,43 85,48 78,50 C 77,46 77,43 77,43 Z" />
    <!-- Leaf 4 -->
    <path d="M 84,20 C 85,15 80,16 79,21 C 81,21 84,20 84,20 Z" />
  </g>
</svg>
